services:
  - type: web
    name: yhq-websocket-server
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install --include=dev && npm run build:server
    startCommand: node server/dist/standalone.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
