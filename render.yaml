services:
  - type: web
    name: yhq-websocket-server
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npx tsx server/standalone.ts
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
