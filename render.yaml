services:
  - type: web
    name: yhq-websocket-server
    env: node
    region: frankfurt
    plan: free
    # ESLATMA (faqat ma'lumot uchun — qaror sizniki): free plan 15 daqiqa trafik
    # bo'lmasa UYQUGA o'tadi va cold start ~30-60s — birinchi duel ulanishi
    # sekin bo'ladi. Keyin trafik oshsa starter'ga ($7/oy) ko'chirish mumkin.
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: node server/dist/index.js
    healthCheckPath: /health
    # KRITIK (audit L-8): octagon matchmaking/duel holati FAQAT IN-MEMORY —
    # bu servis HECH QACHON 1 instance'dan oshmasligi kerak (`numInstances: 1`).
    # 2+ instance'da navbat/duel'lar instance'lar orasida JIMGINA bo'linib qoladi
    # (bir instance'dagi o'yinchi ikkinchisidagini ko'rmaydi). Redeploy'da jonli
    # match'lar uziladi (client'lar rejoin qiladi — grace window).
    # Ko'p instance'ga o'tish kerak bo'lsa — avval Redis/DB-backed matchmaking.
    numInstances: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      # ↓↓↓ Secret'lar — qiymat Render dashboard'da qo'lda kiritiladi (sync: false).
      # assertProdConfig (server/config/index.ts) prod boot'da BOT_TOKEN /
      # CRON_SECRET / OTP_PEPPER'siz FATAL qiladi — ular RO'YXATDA BO'LISHI SHART.
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      # WS origin allowlist (octagon.ts) — sozlanmasa origin tekshiruvi O'CHIQ.
      # Masalan: https://yhq-mini-app.vercel.app yoki prod domen.
      - key: ALLOWED_ORIGIN
        sync: false
      # Referral/deep-link'lar uchun (auth.service url'lari).
      - key: BOT_USERNAME
        sync: false
      - key: APP_URL
        sync: false
      # Ixtiyoriy — monitoring (bo'lmasa Sentry no-op).
      # - key: SENTRY_DSN
      #   sync: false
      # Ixtiyoriy — admin AI savol generatori.
      # - key: GEMINI_API_KEY
      #   sync: false
