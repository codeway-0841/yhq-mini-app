services:
  - type: web
    name: yhq-websocket-server
    env: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: node server/dist/standalone.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false
      # BOT_TOKEN app Environment'da qo'lda (mavjud) — render.yaml'ga yozilmaydi (secret)
