<!DOCTYPE html>
<html lang="uz">
  <!--
    Theme bootstrap: <body> chizilishidan oldin localStorage'dagi theme
    ('yhq-app-store' → settings.theme) o'qilib data-theme qo'yiladi.
    Bu FOUC'ning oldini oladi — splash birinchi kadrdayoq to'g'ri tema bilan chiqadi.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="KIWI — Barcha fanlar uchun zamonaviy ta'lim platformasi. Testlar, biletlar va real vaqtli o'yinlar bitta ilovada." />
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131f24" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KIWI" />
    <meta property="og:description" content="Fanlar bo'yicha testler, biletlar va yo'l belgilari — hammasi bitta ilovada." />
    <title>KIWI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('yhq-app-store')
          var mode = 'dark'
          if (raw) {
            var parsed = JSON.parse(raw)
            var stored = parsed && parsed.state && parsed.state.settings && parsed.state.settings.theme
            if (stored === 'light' || stored === 'dark' || stored === 'system') mode = stored
          }
          var resolved =
            mode === 'system'
              ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
              : mode
          document.body && (document.body.dataset.theme = resolved)
          document.documentElement.dataset.theme = resolved
        } catch (_) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      /* Splash — React yuklanguncha ko'rinadi; index.css tema tokenlari
         hali yuklanmaganligi uchun ranglar shu yerda inline beriladi */
      :root { color-scheme: dark; }
      html[data-theme='light'] { color-scheme: light; }
      html, body { margin: 0; background: #0a1520; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f1f5f9; }
      #app-loader {
        min-height: 100dvh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 24px;
        font-family: Nunito, system-ui, sans-serif;
        color: #fff; background: #0a1520;
      }
      html[data-theme='light'] #app-loader { color: #0f172a; background: #f1f5f9; }
      #app-loader-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
      #app-loader-brand { font-weight: 900; }
      #app-loader-brand em { font-style: normal; color: var(--p-primary, #5be300); }
      #app-loader-spinner {
        width: 36px; height: 36px; border-radius: 50%;
        border: 3px solid #334155; border-top-color: var(--p-primary, #5be300);
        animation: app-spin 0.8s linear infinite;
      }
      html[data-theme='light'] #app-loader-spinner { border-color: #cbd5e1; border-top-color: var(--p-primary, #5be300); }
      @keyframes app-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <div id="app-loader-title"><span id="app-loader-brand">KI<em>WI</em></span></div>
        <div id="app-loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
