<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="KIVVI — imtihonlarga zamonaviy tayyorgarlik platformasi. YHQ biletlari, rus tili va boshqa fanlar: aqlli mashqlar, rasmiy imtihon simulyatori, jonli PvP duellar. Telegram'da va vebda." />
    <meta name="theme-color" content="#06090a" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KIVVI — Imtihonlarga zamonaviy tayyorgarlik" />
    <meta property="og:description" content="Aqlli mashqlar, rasmiy imtihon simulyatori va jonli PvP duellar — bitta ilovada. Bepul boshlang." />
    <meta property="og:image" content="/images/og-cover.png" />
    <!-- Favicon: SVG (K lettermark, dark/light avtomatik) → ICO (badge fallback, eski brauzer) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>KIVVI — Imtihonlarga zamonaviy tayyorgarlik</title>
    <link rel="preload" href="/fonts/onest-variable.ttf" as="font" type="font/ttf" crossorigin />
    <script>
      /* Landing'da ILOVA Service Worker'i kerak emas: ilova avval www.kivvi.uz'da
         yashagan, userlarda eski app-SW qolgan bo'lishi mumkin — u eski shell'ni
         keshdan ko'rsatib landing'ni bloklarardi. Bir marta unregister qilamiz.
         (app.kivvi.uz'da bu sahifa hech qachon serve qilinmaydi — app app.html.) */
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (rs) {
          rs.forEach(function (r) { r.unregister() })
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/landing/main.tsx"></script>
  </body>
</html>
