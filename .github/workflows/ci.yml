name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Unit testlar DB'ga ULANMAYDI (config faqat import uchun parse qiladi).
      # db.invalid hosti: biror test tasodifan ulanmoqchi bo'lsa — localhost'dagi
      # 30s connect-timeout'ga ilinib qolmasdan, DARHOL tez xato bilan yiqiladi
      # (avvalgi phantom-localhost DB sessiya osilgan tuydi).
      DATABASE_URL: postgresql://unit:unit@db.invalid:5432/unit
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: npm
      - name: Dependency audit (prod deps only)
        run: npm audit --omit=dev --audit-level=high
      - run: npm ci --include=dev
      - name: Typecheck (client)
        run: npx tsc --noEmit -p tsconfig.json
      - name: Typecheck (server)
        run: npx tsc --noEmit -p tsconfig.server.json
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit -- --coverage
      - name: API tests
        run: npm run test:api
      - name: Frontend build
        run: npm run build
      - name: Vercel API build
        run: npm run build:api
      - name: Server build (esbuild)
        run: npm run build:server

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: npm
      - run: npm ci --include=dev
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # Full install (system deps) FAQAT cache miss'da — ubuntu runner image'da
      # lib'lar bor, har run'da apt'ga yopishish mirror sekinligida 15min timeout qiladi
      - name: Apt timeouts (o'lik mirror'da ilinib qolmaslik uchun)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: |
          echo 'Acquire::http::Timeout "15";' | sudo tee /etc/apt/apt.conf.d/99ci-timeouts
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99ci-timeouts
          echo 'Acquire::Retries "3";' | sudo tee -a /etc/apt/apt.conf.d/99ci-timeouts
      - name: Install Playwright Browsers (full — cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Install Playwright Browsers (cached)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium
      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          CI: true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/yhq_prod_guard_only
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/yhq_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.1
          cache: npm
      - run: npm ci --include=dev
      - name: Create test databases
        run: |
          PGPASSWORD=test psql -h localhost -U test -d postgres -c "CREATE DATABASE yhq_test;"
          PGPASSWORD=test psql -h localhost -U test -d postgres -c "CREATE DATABASE yhq_prod_guard_only;"
      - name: Apply migrations to test DB
        run: npm run db:migrate
      - name: Seed minimal test content (idempotent)
        run: npx tsx tests/integration/seed-db.ts
      - name: Integration tests (API + WS)
        run: npm run test:integration
