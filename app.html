<!DOCTYPE html>
<html lang="uz">
  <!--
    Theme bootstrap: <body> chizilishidan oldin localStorage'dagi theme
    ('yhq-app-store' → settings.theme) o'qilib data-theme qo'yiladi.
    Bu FOUC'ning oldini oladi — splash birinchi kadrdayoq to'g'ri tema bilan chiqadi.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="description" content="KIVVI — Barcha fanlar uchun zamonaviy ta'lim platformasi. Testlar, biletlar va real vaqtli o'yinlar bitta ilovada." />
    <meta name="theme-color" id="theme-color-meta" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Favicon: SVG (K lettermark, dark/light avtomatik) → ICO (badge fallback, eski brauzer) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KIVVI" />
    <meta property="og:image" content="/images/og-cover.png" />
    <meta property="og:description" content="Fanlar bo'yicha testler, biletlar va yo'l belgilari — hammasi bitta ilovada." />
    <title>KIVVI</title>
    <script>
      /* Toza URL: app.kivvi.uz/app.html → app.kivvi.uz/ — bundle yuklanishini
         kutmasdan, parse paytidayoq (address bar hech qachon app.html
         ko'rsatmaydi). MANTIQ SSOT: src/shared/lib/clean-url.ts — o'zgarish
         ikkalasiga kiritiladi. FAQAT app host: boshqa hostlarda `/` landing'ni
         serve qiladi va strip reload'ni sindirardi. */
      ;(function () {
        try {
          if (window.location.hostname !== 'app.kivvi.uz') return
          var p = window.location.pathname
          if (p.slice(-9) === '/app.html') {
            window.history.replaceState(
              null,
              '',
              (p.slice(0, -9) || '/') + window.location.search + window.location.hash
            )
          }
        } catch (_) {}
      })()
    </script>
    <!-- defer: HTML parse'ni bloklamaydi. `type="module"` (main.tsx) ham
         defer semantikasida va HUJJAT TARTIBIDA keyin ishga tushadi — ya'ni
         window.Telegram App mount'idan oldin mavjud bo'lishi kafolatlangan. -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- DEV-MOCK-START (vite.config.ts faqat dev'da saqlaydi — prod build'dan o'chiriladi) -->
    <!--
      type="module" ATAYLAB: telegram-web-app.js `defer` bilan yuklanadi va
      module skriptlar u bilan BIR RO'YXATDA, hujjat tartibida ishlaydi. Oddiy
      inline skript esa parse paytida, ya'ni deferred skriptdan OLDIN ishlardi —
      mock o'rnatilib, keyin haqiqiy telegram-web-app.js uni (initData'siz)
      ustiga yozib yuborardi va localhost'da ilova LoginPage'da qolardi.
    -->
    <script type="module">
      // Dev mock: inject fake Telegram user when ?tg=1 query param is provided on localhost
      ;(function() {
        var isLocal = window.location.protocol === 'http:' && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        var search = window.location.search || ''
        var hash = window.location.hash || ''
        var forceTg = search.includes('tg=1') || hash.includes('tg=1')
        if (isLocal && forceTg && (!window.Telegram || !window.Telegram.WebApp || !window.Telegram.WebApp.initData)) {
          var backButtonCallbacks = []
          var mainButtonCallbacks = []
          var nowSec = Math.floor(Date.now() / 1000)

          window.Telegram = window.Telegram || {}
          window.Telegram.WebApp = {
            ready: function() { console.log('[DEV] Telegram.WebApp.ready()') },
            expand: function() { console.log('[DEV] Telegram.WebApp.expand()') },
            close: function() { console.log('[DEV] Telegram.WebApp.close()') },
            openLink: function(url) { window.open(url, '_blank') },
            openTelegramLink: function(url) { console.log('[DEV] openTelegramLink:', url) },
            shareURL: function(url, text) { console.log('[DEV] shareURL:', url, text) },
            version: '6.0',
            platform: 'web',
            colorScheme: 'dark',
            themeParams: {},
            initData: 'query_id=DEV&user=%7B%22id%22%3A999999999%2C%22first_name%22%3A%22Dev%22%2C%22last_name%22%3A%22User%22%2C%22username%22%3A%22devuser%22%7D&auth_date=' + nowSec + '&hash=dev',
            initDataUnsafe: {
              auth_date: nowSec,
              user: {
                id: 999999999,
                first_name: 'Dev',
                last_name: 'User',
                username: 'devuser'
              }
            },
            BackButton: {
              isVisible: false,
              show: function() { this.isVisible = true; console.log('[DEV] BackButton.show()') },
              hide: function() { this.isVisible = false; console.log('[DEV] BackButton.hide()') },
              onClick: function(cb) { if (typeof cb === 'function') backButtonCallbacks.push(cb) },
              offClick: function(cb) {
                var idx = backButtonCallbacks.indexOf(cb)
                if (idx !== -1) backButtonCallbacks.splice(idx, 1)
              }
            },
            MainButton: {
              isVisible: false,
              isActive: true,
              text: '',
              color: '#1a81fc',
              textColor: '#ffffff',
              show: function() { this.isVisible = true; console.log('[DEV] MainButton.show()') },
              hide: function() { this.isVisible = false; console.log('[DEV] MainButton.hide()') },
              enable: function() { this.isActive = true },
              disable: function() { this.isActive = false },
              showProgress: function() { console.log('[DEV] MainButton.showProgress()') },
              hideProgress: function() { console.log('[DEV] MainButton.hideProgress()') },
              setText: function(text) { this.text = text },
              onClick: function(cb) { if (typeof cb === 'function') mainButtonCallbacks.push(cb) },
              offClick: function(cb) {
                var idx = mainButtonCallbacks.indexOf(cb)
                if (idx !== -1) mainButtonCallbacks.splice(idx, 1)
              }
            },
            onEvent: function() {},
            offEvent: function() {}
          }

          // Dev keyboard shortcuts: Esc = BackButton, Ctrl+Enter = MainButton
          document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && window.Telegram.WebApp.BackButton.isVisible) {
              console.log('[DEV] BackButton triggered (Esc)')
              backButtonCallbacks.forEach(function(cb) { cb() })
            }
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && window.Telegram.WebApp.MainButton.isVisible && window.Telegram.WebApp.MainButton.isActive) {
              console.log('[DEV] MainButton triggered (Ctrl+Enter)')
              mainButtonCallbacks.forEach(function(cb) { cb() })
            }
          })

          console.log('[DEV] Mock Telegram user injected (id: 999999999). Shortcuts: Esc=Back, Ctrl+Enter=Main')
        }
      })()
    </script>
    <!-- DEV-MOCK-END -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('yhq-app-store')
          var mode = 'dark'
          if (raw) {
            var parsed = JSON.parse(raw)
            var stored = parsed && parsed.state && parsed.state.settings && parsed.state.settings.theme
            if (stored === 'light' || stored === 'dark' || stored === 'system') mode = stored
          }
          var resolved =
            mode === 'system'
              ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
              : mode
          document.body && (document.body.dataset.theme = resolved)
          document.documentElement.dataset.theme = resolved
          var themeColor = resolved === 'light' ? '#fafaf9' : '#0d1117'
          document.documentElement.style.backgroundColor = themeColor
          var metaEl = document.getElementById('theme-color-meta')
          if (metaEl) metaEl.setAttribute('content', themeColor)
        } catch (_) {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.style.backgroundColor = '#0d1117'
          var metaEl = document.getElementById('theme-color-meta')
          if (metaEl) metaEl.setAttribute('content', '#0d1117')
        }
      })()
    </script>
    <!-- Splash rasmi HTML parse paytidayoq yuklana boshlaydi — React mount
         bo'lishini kutmaydi. type=image/webp: webp'ni qo'llamaydigan brauzer
         preload'ni butunlay o'tkazib yuboradi (behuda trafik yo'q), rasmning
         o'zi esa <picture> orqali png'ga tushadi. -->
    <link rel="preload" as="image" type="image/webp" href="/images/splash-brand.webp" />
    <!-- Boot loader'dagi logo (React'dan oldin ko'rinadi) — darhol yuklansin -->
    <link rel="preload" as="image" type="image/webp" href="/images/brand-badge.webp" />
    <link rel="preload" as="image" type="image/webp" href="/images/brand-wordmark.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Shriftlar ikkiga bo'lingan (boot perf):
        1) DEFAULT (Inter Tight + Bricolage Grotesque) — har bir userga kerak.
           media="print" + onload hiylasi: <link> render'ni BLOKLAMAYDI, lekin
           darhol yuklanadi. font-display=swap tufayli matn system-font bilan
           birinchi kadrdayoq chiqadi.
        2) OPTIONAL (Jakarta/Outfit/Lora/JetBrains) — faqat user Sozlamalarda
           o'sha shriftni tanlasa yuklanadi (src/shared/lib/fonts.ts).
    -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter+Tight:wght@400;500;600;700&display=swap"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <style>
      /* Splash — React yuklanguncha ko'rinadi; index.css tema tokenlari
         hali yuklanmaganligi uchun ranglar shu yerda inline beriladi */
      :root { color-scheme: dark; }
      html[data-theme='light'] { color-scheme: light; }
      html, body { margin: 0; background: #0d1117; }
      html[data-theme='light'], html[data-theme='light'] body { background: #fafaf9; }
      #app-loader {
        min-height: 100dvh; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 24px;
        font-family: 'Inter Tight', system-ui, sans-serif;
        color: #f5f5f4; background: #0d1117;
      }
      html[data-theme='light'] #app-loader { color: #1c1917; background: #fafaf9; }
      #app-loader-title { display: flex; align-items: center; gap: 10px; }
      #app-loader-title img { display: block; }
      #app-loader-spinner {
        width: 36px; height: 36px; border-radius: 50%;
        border: 3px solid #1c222b; border-top-color: var(--p-primary, #1a81fc);
        animation: app-spin 0.8s linear infinite;
      }
      html[data-theme='light'] #app-loader-spinner { border-color: #d6d3d1; border-top-color: var(--p-primary, #1a81fc); }
      @keyframes app-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader">
        <div id="app-loader-title">
          <img src="/images/brand-badge.webp" alt="" width="40" height="40" />
          <img src="/images/brand-wordmark.webp" alt="kivvi" width="110" height="32" style="height: 26px; width: auto;" />
        </div>
        <div id="app-loader-spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
