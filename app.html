<!DOCTYPE html>
<html lang="uz">
  <!--
    Theme bootstrap: <body> chizilishidan oldin localStorage'dagi theme
    ('yhq-app-store' → settings.theme) o'qilib data-theme qo'yiladi.
    Bu FOUC'ning oldini oladi — splash birinchi kadrdayoq to'g'ri tema bilan chiqadi.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="description" content="KIVVI — Barcha fanlar uchun zamonaviy ta'lim platformasi. Testlar, biletlar va real vaqtli o'yinlar bitta ilovada." />
    <meta name="theme-color" id="theme-color-meta" content="#0d1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Favicon: SVG (K lettermark, dark/light avtomatik) → ICO (badge fallback, eski brauzer) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KIVVI" />
    <meta property="og:image" content="/images/og-cover.png" />
    <meta property="og:description" content="Barcha fanlar bo'yicha testlar, rasmiy imtihon simulyatori va jonli PvP duellar — bitta ilovada." />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400..900;1,400..900&family=Rubik:ital,wght@0,400..900;1,400..900&family=Share+Tech+Mono&family=Slabo+27px&family=Young+Serif&display=swap" rel="stylesheet">
    <title>KIVVI</title>
    <script>
      /* Toza URL: app.kivvi.uz/app.html → app.kivvi.uz/ — bundle yuklanishini
         kutmasdan, parse paytidayoq (address bar hech qachon app.html
         ko'rsatmaydi). MANTIQ SSOT: src/shared/lib/clean-url.ts — o'zgarish
         ikkalasiga kiritiladi. FAQAT app host: boshqa hostlarda `/` landing'ni
         serve qiladi va strip reload'ni sindirardi. */
      ;(function () {
        try {
          if (window.location.hostname !== 'app.kivvi.uz') return
          var p = window.location.pathname
          if (p.slice(-9) === '/app.html') {
            window.history.replaceState(
              null,
              '',
              (p.slice(0, -9) || '/') + window.location.search + window.location.hash
            )
          }
        } catch (_) {}
      })()
    </script>
    <!-- defer: HTML parse'ni bloklamaydi. `type="module"` (main.tsx) ham
         defer semantikasida va HUJJAT TARTIBIDA keyin ishga tushadi — ya'ni
         window.Telegram App mount'idan oldin mavjud bo'lishi kafolatlangan. -->
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- DEV-MOCK-START (vite.config.ts faqat dev'da saqlaydi — prod build'dan o'chiriladi) -->
    <!--
      type="module" ATAYLAB: telegram-web-app.js `defer` bilan yuklanadi va
      module skriptlar u bilan BIR RO'YXATDA, hujjat tartibida ishlaydi. Oddiy
      inline skript esa parse paytida, ya'ni deferred skriptdan OLDIN ishlardi —
      mock o'rnatilib, keyin haqiqiy telegram-web-app.js uni (initData'siz)
      ustiga yozib yuborardi va localhost'da ilova LoginPage'da qolardi.
    -->
    <script type="module">
      // Dev mock: inject fake Telegram user when ?tg=1 query param is provided on localhost
      // (OPT-IN — default avtomatik emas: e2e login testlari Telegram'siz muhitda
      // LoginPage kutadi; default-on ularni Onboarding'ga burib yuborib sindirgan.
      // Lokal TG-test uchun: /app.html?tg=1#/...)
      ;(function() {
        var isLocal = window.location.protocol === 'http:' && (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        var search = window.location.search || ''
        var hash = window.location.hash || ''
        var forceTg = search.includes('tg=1') || hash.includes('tg=1')
        if (isLocal && forceTg && (!window.Telegram || !window.Telegram.WebApp || !window.Telegram.WebApp.initData)) {
          var backButtonCallbacks = []
          var mainButtonCallbacks = []
          var nowSec = Math.floor(Date.now() / 1000)

          window.Telegram = window.Telegram || {}
          window.Telegram.WebApp = {
            ready: function() { console.log('[DEV] Telegram.WebApp.ready()') },
            expand: function() { console.log('[DEV] Telegram.WebApp.expand()') },
            close: function() { console.log('[DEV] Telegram.WebApp.close()') },
            openLink: function(url) { window.open(url, '_blank') },
            openTelegramLink: function(url) { console.log('[DEV] openTelegramLink:', url) },
            shareURL: function(url, text) { console.log('[DEV] shareURL:', url, text) },
            version: '6.0',
            platform: 'web',
            colorScheme: 'dark',
            themeParams: {},
            initData: 'query_id=DEV&user=%7B%22id%22%3A999999999%2C%22first_name%22%3A%22Dev%22%2C%22last_name%22%3A%22User%22%2C%22username%22%3A%22devuser%22%7D&auth_date=' + nowSec + '&hash=dev',
            initDataUnsafe: {
              auth_date: nowSec,
              user: {
                id: 999999999,
                first_name: 'Dev',
                last_name: 'User',
                username: 'devuser'
              }
            },
            BackButton: {
              isVisible: false,
              show: function() { this.isVisible = true; console.log('[DEV] BackButton.show()') },
              hide: function() { this.isVisible = false; console.log('[DEV] BackButton.hide()') },
              onClick: function(cb) { if (typeof cb === 'function') backButtonCallbacks.push(cb) },
              offClick: function(cb) {
                var idx = backButtonCallbacks.indexOf(cb)
                if (idx !== -1) backButtonCallbacks.splice(idx, 1)
              }
            },
            MainButton: {
              isVisible: false,
              isActive: true,
              text: '',
              color: '#1a81fc',
              textColor: '#ffffff',
              show: function() { this.isVisible = true; console.log('[DEV] MainButton.show()') },
              hide: function() { this.isVisible = false; console.log('[DEV] MainButton.hide()') },
              enable: function() { this.isActive = true },
              disable: function() { this.isActive = false },
              showProgress: function() { console.log('[DEV] MainButton.showProgress()') },
              hideProgress: function() { console.log('[DEV] MainButton.hideProgress()') },
              setText: function(text) { this.text = text },
              onClick: function(cb) { if (typeof cb === 'function') mainButtonCallbacks.push(cb) },
              offClick: function(cb) {
                var idx = mainButtonCallbacks.indexOf(cb)
                if (idx !== -1) mainButtonCallbacks.splice(idx, 1)
              }
            },
            onEvent: function() {},
            offEvent: function() {}
          }

          // Dev keyboard shortcuts: Esc = BackButton, Ctrl+Enter = MainButton
          document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && window.Telegram.WebApp.BackButton.isVisible) {
              console.log('[DEV] BackButton triggered (Esc)')
              backButtonCallbacks.forEach(function(cb) { cb() })
            }
            if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && window.Telegram.WebApp.MainButton.isVisible && window.Telegram.WebApp.MainButton.isActive) {
              console.log('[DEV] MainButton triggered (Ctrl+Enter)')
              mainButtonCallbacks.forEach(function(cb) { cb() })
            }
          })

          console.log('[DEV] Mock Telegram user injected (id: 999999999). Shortcuts: Esc=Back, Ctrl+Enter=Main')
        }
      })()
    </script>
    <!-- DEV-MOCK-END -->
    <script>
      ;(function () {
        try {
          var raw = localStorage.getItem('yhq-app-store')
          var mode = 'dark'
          if (raw) {
            var parsed = JSON.parse(raw)
            var stored = parsed && parsed.state && parsed.state.settings && parsed.state.settings.theme
            if (stored === 'light' || stored === 'dark' || stored === 'system') mode = stored
          }
          var resolved =
            mode === 'system'
              ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
              : mode
          document.body && (document.body.dataset.theme = resolved)
          document.documentElement.dataset.theme = resolved
          var themeColor = resolved === 'light' ? '#f0f3f6' : '#0d1117'
          document.documentElement.style.backgroundColor = themeColor
          var metaEl = document.getElementById('theme-color-meta')
          if (metaEl) metaEl.setAttribute('content', themeColor)
        } catch (_) {
          document.documentElement.dataset.theme = 'dark'
          document.documentElement.style.backgroundColor = '#0d1117'
          var metaEl = document.getElementById('theme-color-meta')
          if (metaEl) metaEl.setAttribute('content', '#0d1117')
        }
      })()
    </script>
    <!-- Launch belgisi HTML parse paytidayoq yuklana boshlaydi — React mount
         bo'lishini kutmaydi. type=image/webp: webp'ni qo'llamaydigan brauzer
         preload'ni butunlay o'tkazib yuboradi (behuda trafik yo'q), rasmning
         o'zi esa <picture> orqali png'ga tushadi. -->
    <link rel="preload" as="image" type="image/webp" href="/images/splash-mark.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Shriftlar ikkiga bo'lingan (boot perf):
        1) DEFAULT (Inter Tight + Bricolage Grotesque) — har bir userga kerak.
           media="print" + onload hiylasi: <link> render'ni BLOKLAMAYDI, lekin
           darhol yuklanadi. font-display=swap tufayli matn system-font bilan
           birinchi kadrdayoq chiqadi.
        2) OPTIONAL (Jakarta/Outfit/Lora/JetBrains) — faqat user Sozlamalarda
           o'sha shriftni tanlasa yuklanadi (src/shared/lib/fonts.ts).
    -->
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter+Tight:wght@400;500;600;700&display=swap"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter+Tight:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <style>
      /* LAUNCH SCREEN — referens (video 00:00–00:04): to'r kataklar (organik 3D to'lqin)
         ko'k fonda chayqaladi, markazdagi belgi esa mayin nafas oladi.
         React mount bo'lguncha shu ekran turadi, keyin SplashScreen.tsx
         AYNAN shu vaqtdan (window.__kivviSplashStart) davom ettiradi. */
      :root { color-scheme: dark; }
      html[data-theme='light'] { color-scheme: light; }
      html, body, #root { width: 100%; height: 100%; margin: 0; }
      html, body { background: #0d1117; }
      html[data-theme='light'], html[data-theme='light'] body { background: #f0f3f6; }
      #app-loader {
        position: fixed; inset: 0;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
        background: radial-gradient(circle at 50% 42%, #2089ff 0%, #126ee6 58%, #0952b8 100%);
      }
      #app-loader-grid { display: none; }
      #app-loader-cell-grid {
        position: absolute; inset: 0; pointer-events: none; overflow: hidden;
        background-image:
          linear-gradient(to right, rgba(255, 255, 255, 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.07) 1px, transparent 1px);
        background-size: 50px 50px;
      }
      .splash-wave-canvas {
        position: absolute; inset: 0; width: 100%; height: 100%; display: block; pointer-events: none;
      }
      #app-loader-cell {
        position: relative;
        flex: none;
        display: flex; align-items: center; justify-content: center;
        overflow: hidden;
        width: 100%; height: 100%; border-radius: 0;
        background: radial-gradient(circle at 50% 42%, #2089ff 0%, #126ee6 58%, #0952b8 100%);
      }
      #app-loader-cell picture {
        position: relative; display: flex; align-items: center; justify-content: center; z-index: 2;
      }
      #app-loader-mark {
        display: block; width: min(28vw, 122px); height: auto;
        filter: drop-shadow(0 10px 30px rgba(3, 27, 78, 0.32));
      }
      @media (prefers-reduced-motion: no-preference) {
        #app-loader-mark {
          animation:
            app-loader-mark-enter 350ms cubic-bezier(.16, 1, .3, 1) both,
            app-loader-mark-breathe 3.8s ease-in-out 400ms infinite;
        }
      }
      @keyframes app-loader-mark-enter {
        from { opacity: 0; transform: scale(0.96); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes app-loader-mark-breathe {
        0%, 100% { transform: translateY(0) scale(1); }
        50%      { transform: translateY(-4px) scale(1.025); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-loader" role="status" aria-label="KIVVI yuklanmoqda">
        <div id="app-loader-grid" aria-hidden="true"></div>
        <div id="app-loader-cell">
          <div id="app-loader-cell-grid" aria-hidden="true">
            <canvas id="app-loader-canvas" class="splash-wave-canvas" aria-hidden="true"></canvas>
          </div>
          <picture>
            <source srcset="/images/splash-mark.webp" type="image/webp" />
            <img
              id="app-loader-mark"
              src="/images/splash-mark.png"
              alt="KIVVI"
              width="512"
              height="512"
            />
          </picture>
        </div>
      </div>
    </div>
    <script>
      window.__kivviSplashStart = performance.now();
      ;(function() {
        var cvs = document.getElementById('app-loader-canvas');
        if (!cvs || !cvs.getContext) return;
        var ctx = cvs.getContext('2d');
        if (!ctx) return;
        var start = window.__kivviSplashStart;
        var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
        var w = 0, h = 0, raf = 0;
        function resize() {
          var r = cvs.getBoundingClientRect();
          w = Math.max(r.width, 1);
          h = Math.max(r.height, 1);
          cvs.width = Math.floor(w * dpr);
          cvs.height = Math.floor(h * dpr);
        }
        resize();
        window.addEventListener('resize', resize);
        function draw(t) {
          ctx.save();
          ctx.scale(dpr, dpr);
          ctx.clearRect(0, 0, w, h);
          var step = Math.max(46, Math.min(54, w / 7.5));
          var pad = step * 1.5;
          var cols = Math.ceil((w + pad * 2) / step) + 1;
          var rows = Math.ceil((h + pad * 2) / step) + 1;
          var startX = -pad, startY = -pad;
          var pts = [];
          var cx = w * 0.5, cy = h * 0.45;
          for (var j = 0; j < rows; j++) {
            var row = [];
            var y0 = startY + j * step;
            for (var i = 0; i < cols; i++) {
              var x0 = startX + i * step;
              var th1 = x0 * 0.016 + y0 * 0.011 - t * 1.65;
              var w1 = Math.sin(th1) * 8.5;
              var th2 = -x0 * 0.012 + y0 * 0.019 + t * 1.25;
              var w2 = Math.cos(th2) * 5.5;
              var dx = x0 - cx, dy = y0 - cy;
              var d = Math.hypot(dx, dy);
              var th3 = d * 0.015 - t * 1.9;
              var w3 = Math.sin(th3) * 4.0;
              var nf = d > 1 ? 1 / d : 0;
              var px = x0 + Math.cos(x0 * 0.009 + t * 1.1) * (w1 * 0.35) + dx * nf * w3;
              var py = y0 + w1 + w2 + dy * nf * w3;
              row.push({ x: px, y: py });
            }
            pts.push(row);
          }
          ctx.beginPath();
          for (var j = 0; j < rows; j++) {
            var r = pts[j];
            ctx.moveTo(r[0].x, r[0].y);
            for (var i = 0; i < cols - 1; i++) {
              var mx = (r[i].x + r[i + 1].x) * 0.5;
              var my = (r[i].y + r[i + 1].y) * 0.5;
              ctx.quadraticCurveTo(r[i].x, r[i].y, mx, my);
            }
            ctx.lineTo(r[cols - 1].x, r[cols - 1].y);
          }
          for (var i = 0; i < cols; i++) {
            ctx.moveTo(pts[0][i].x, pts[0][i].y);
            for (var j = 0; j < rows - 1; j++) {
              var mx = (pts[j][i].x + pts[j + 1][i].x) * 0.5;
              var my = (pts[j][i].y + pts[j + 1][i].y) * 0.5;
              ctx.quadraticCurveTo(pts[j][i].x, pts[j][i].y, mx, my);
            }
            ctx.lineTo(pts[rows - 1][i].x, pts[rows - 1][i].y);
          }
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
          ctx.lineWidth = 1.25;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          ctx.stroke();
          ctx.restore();
        }
        if (reduced) { draw(0); return; }
        function loop(now) {
          draw((now - start) / 1000);
          raf = requestAnimationFrame(loop);
        }
        raf = requestAnimationFrame(loop);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
